name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate plugin package
        run: npm run plugin:validate
      - name: Smoke-test local doctor
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/workspace"
          cat > "$TMP/policy.yaml" <<EOF
          version: 1
          mode: workspace
          workspaces:
            - id: smoke
              root: $TMP/workspace
              readOnly: false
          filesystem:
            maxReadBytes: 1048576
            maxWriteBytes: 1048576
          search:
            maxResults: 20
            maxFiles: 100
            maxFileBytes: 1048576
          process:
            allowExecutables: [node]
            inheritEnv: [PATH, HOME, LANG]
            maxOutputBytes: 65536
            maxRuntimeMs: 30000
          tasks: {}
          EOF
          cat > "$TMP/hosts.yaml" <<EOF
          version: 1
          hosts: []
          EOF
          chmod 600 "$TMP/policy.yaml" "$TMP/hosts.yaml"
          RWMCP_POLICY="$TMP/policy.yaml" \
          RWMCP_HOSTS="$TMP/hosts.yaml" \
          RWMCP_CONFIG_HOME="$TMP/config" \
          RWMCP_HOME="$TMP/data" \
          node scripts/doctor-user.mjs --json
      - name: Smoke-test packed artifact
        run: bash scripts/smoke-package.sh

  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate plugin package
        run: npm run plugin:validate
      - name: Smoke-test persisted setup state and DPAPI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configDir = Join-Path $env:LOCALAPPDATA 'RemoteWorkstationMCP'
          $secretDir = Join-Path $configDir 'secrets'
          New-Item -ItemType Directory -Force -Path $secretDir | Out-Null
          $settingsPath = Join-Path $configDir 'settings.json'
          @{
            version = 1
            mcpPort = 18765
            workspaceRoot = (Join-Path $env:RUNNER_TEMP 'rwmcp-persisted-workspace')
            tunnelId = 'tunnel_0123456789abcdef0123456789abcdef'
            organizationId = 'org-ci'
            cloudflaredManaged = $false
          } | ConvertTo-Json | Set-Content -Path $settingsPath -Encoding utf8

          . (Join-Path $PWD 'scripts\windows-settings.ps1')
          Remove-Item Env:RWMCP_PORT -ErrorAction SilentlyContinue
          Remove-Item Env:CONTROL_PLANE_TUNNEL_ID -ErrorAction SilentlyContinue
          Remove-Item Env:CONTROL_PLANE_ORGANIZATION_ID -ErrorAction SilentlyContinue
          Apply-RwmcpPersistedEnvironment -Root $PWD | Out-Null
          if ($env:RWMCP_PORT -ne '18765') { throw "Persisted MCP port was not loaded: $($env:RWMCP_PORT)" }
          if ($env:CONTROL_PLANE_TUNNEL_ID -ne 'tunnel_0123456789abcdef0123456789abcdef') { throw 'Persisted tunnel id was not loaded.' }
          if ($env:CONTROL_PLANE_ORGANIZATION_ID -ne 'org-ci') { throw 'Persisted organization id was not loaded.' }

          $secretPath = Get-RwmcpSecretPath
          $testSecret = 'sk-test-rwmcp-dpapi-0123456789abcdef'
          $testSecret | & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-secret.ps1 -Action Set -Path $secretPath
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI secret write failed.' }
          $roundTrip = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-secret.ps1 -Action Get -Path $secretPath
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI secret read failed.' }
          if ($roundTrip.Trim() -ne $testSecret) { throw 'DPAPI secret round-trip mismatch.' }
          Remove-Item -Path $configDir -Recurse -Force
      - name: Smoke-test loopback HTTP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'rwmcp-win-smoke'
          $workspace = Join-Path $tmp 'workspace'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $workspaceYaml = $workspace.Replace('\', '/')
          $policy = @"
          version: 1
          mode: workspace
          workspaces:
            - id: smoke
              root: $workspaceYaml
              readOnly: false
          filesystem:
            maxReadBytes: 1048576
            maxWriteBytes: 1048576
          search:
            maxResults: 20
            maxFiles: 100
            maxFileBytes: 1048576
          process:
            allowExecutables: [node]
            inheritEnv: [PATH, USERPROFILE, TEMP, TMP]
            maxOutputBytes: 65536
            maxRuntimeMs: 30000
          tasks: {}
          "@
          $hosts = @"
          version: 1
          hosts: []
          "@
          $policyPath = Join-Path $tmp 'policy.yaml'
          $hostsPath = Join-Path $tmp 'hosts.yaml'
          Set-Content -Path $policyPath -Value $policy -Encoding utf8
          Set-Content -Path $hostsPath -Value $hosts -Encoding utf8
          $env:RWMCP_POLICY = $policyPath
          $env:RWMCP_HOSTS = $hostsPath
          $env:RWMCP_AUDIT = Join-Path $tmp 'audit.jsonl'
          $env:RWMCP_CLIENT_ID = 'windows-ci'
          $env:RWMCP_CLIENT_TYPE = 'ci'
          $process = Start-Process -FilePath node -ArgumentList 'dist/cli.js','--http' -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/healthz' -TimeoutSec 2
                if ($health.ok -eq $true) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw 'Windows loopback MCP health check did not become ready.' }
            if ($health.mode -ne 'workspace') { throw "Unexpected mode: $($health.mode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
