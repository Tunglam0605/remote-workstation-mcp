name: CI

on:
  push:
    branches: [main, fix/v0.9.8-recovery-heartbeat]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate plugin package
        run: npm run plugin:validate
      - name: Smoke-test local doctor
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/workspace"
          cat > "$TMP/policy.yaml" <<EOF
          version: 1
          mode: workspace
          workspaces:
            - id: smoke
              root: $TMP/workspace
              readOnly: false
          filesystem:
            maxReadBytes: 1048576
            maxWriteBytes: 1048576
          search:
            maxResults: 20
            maxFiles: 100
            maxFileBytes: 1048576
          process:
            allowExecutables: [node]
            inheritEnv: [PATH, HOME, LANG]
            maxOutputBytes: 65536
            maxRuntimeMs: 30000
          tasks: {}
          EOF
          cat > "$TMP/hosts.yaml" <<EOF
          version: 1
          hosts: []
          EOF
          chmod 600 "$TMP/policy.yaml" "$TMP/hosts.yaml"
          RWMCP_POLICY="$TMP/policy.yaml" \
          RWMCP_HOSTS="$TMP/hosts.yaml" \
          RWMCP_CONFIG_HOME="$TMP/config" \
          RWMCP_HOME="$TMP/data" \
          node scripts/doctor-user.mjs --json
      - name: Smoke-test packed artifact
        run: bash scripts/smoke-package.sh

  build-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate plugin package
        run: npm run plugin:validate
      - name: Smoke-test packed Windows engineering runtime
        shell: pwsh
        run: .\scripts\smoke-package-windows.ps1
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'scripts/install-windows-release.ps1',
            'scripts/update-windows.ps1',
            'scripts/update-handoff-windows.ps1',
            'scripts/test-update-handoff-windows.ps1',
            'scripts/runtime-control-windows.ps1',
            'scripts/windows-recovery-state.ps1',
            'scripts/autonomous-recovery-windows.ps1',
            'scripts/test-autonomous-recovery-state-windows.ps1',
            'scripts/test-autonomous-recovery-windows.ps1',
            'scripts/runtime-host-windows.ps1',
            'scripts/control-center-host-windows.ps1',
            'scripts/test-control-center-watchdog-windows.ps1',
            'scripts/control-center-windows.ps1',
            'scripts/admin-approval-windows.ps1',
            'scripts/privileged-helper-windows.ps1',
            'scripts/windows-settings.ps1',
            'scripts/windows-secret.ps1',
            'scripts/lib/tunnel-health-windows.ps1',
            'scripts/test-tunnel-health-windows.ps1',
            'scripts/setup-web-windows.ps1',
            'scripts/start-windows.ps1',
            'scripts/start-openai-windows.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parse failed for ${file}: $messages"
            }
          }
      - name: Test Windows Control Center watchdog recovery
        shell: pwsh
        run: .\scripts\test-control-center-watchdog-windows.ps1
      - name: Test Windows tunnel control-plane health parser
        shell: pwsh
        run: .\scripts\test-tunnel-health-windows.ps1
      - name: Test durable Windows restart handoff
        shell: pwsh
        run: .\scripts\test-restart-handoff-windows.ps1
      - name: Test Windows autonomous recovery desired state
        shell: pwsh
        run: .\scripts\test-autonomous-recovery-state-windows.ps1
      - name: Test Windows autonomous recovery decision loop
        shell: pwsh
        run: .\scripts\test-autonomous-recovery-windows.ps1
      - name: Test durable Windows update handoff success path
        shell: pwsh
        run: .\scripts\test-update-handoff-windows.ps1 -Mode Success
      - name: Test durable Windows recovery worker exit
        shell: pwsh
        run: .\scripts\test-update-handoff-windows.ps1 -Mode FailureExit
      - name: Test durable Windows recovery transaction state
        shell: pwsh
        run: .\scripts\test-update-handoff-windows.ps1 -Mode FailureTransaction
      - name: Test durable Windows recovery status
        shell: pwsh
        run: .\scripts\test-update-handoff-windows.ps1 -Mode FailureRecovery
      - name: Test durable Windows recovery marker
        shell: pwsh
        run: .\scripts\test-update-handoff-windows.ps1 -Mode FailureMarker
      - name: Smoke-test Windows updater state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $savedLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'rwmcp-update-smoke'
          try {
            $script = Join-Path $PWD 'scripts\update-windows.ps1'
            $enabled = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -Action Enable -Json | ConvertFrom-Json
            if (-not $enabled.enabled -or $enabled.channel -ne 'stable' -or -not $enabled.checkOnStartup) { throw 'Auto-update defaults are invalid.' }
            $failed = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -Action MarkFailed -Version 9.9.9 -Json | ConvertFrom-Json
            if ($failed.failedVersion -ne '9.9.9' -or -not $failed.retryAfter) { throw 'Failed-release backoff was not persisted.' }
            $disabled = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -Action Disable -Json | ConvertFrom-Json
            if ($disabled.enabled) { throw 'Auto-update disable did not persist.' }
            if (-not (Test-Path (Join-Path $PWD 'scripts\install-windows-bootstrap.cmd'))) { throw 'Double-click Windows bootstrap installer is missing.' }
          } finally {
            $env:LOCALAPPDATA = $savedLocalAppData
          }

      - name: Smoke-test persisted setup state and DPAPI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configDir = Join-Path $env:LOCALAPPDATA 'RemoteWorkstationMCP'
          $secretDir = Join-Path $configDir 'secrets'
          New-Item -ItemType Directory -Force -Path $secretDir | Out-Null
          $settingsPath = Join-Path $configDir 'settings.json'
          @{
            version = 1
            mcpPort = 18765
            workspaceRoot = (Join-Path $env:RUNNER_TEMP 'rwmcp-persisted-workspace')
            tunnelId = 'tunnel_0123456789abcdef0123456789abcdef'
            organizationId = 'org-ci'
            cloudflaredManaged = $false
            httpScopes = @('workstation.read','workstation.write','workstation.execute')
          } | ConvertTo-Json | Set-Content -Path $settingsPath -Encoding utf8

          . (Join-Path $PWD 'scripts\windows-settings.ps1')
          Remove-Item Env:RWMCP_PORT -ErrorAction SilentlyContinue
          Remove-Item Env:CONTROL_PLANE_TUNNEL_ID -ErrorAction SilentlyContinue
          Remove-Item Env:CONTROL_PLANE_ORGANIZATION_ID -ErrorAction SilentlyContinue
          Apply-RwmcpPersistedEnvironment -Root $PWD | Out-Null
          if ($env:RWMCP_PORT -ne '18765') { throw "Persisted MCP port was not loaded: $($env:RWMCP_PORT)" }
          if ($env:CONTROL_PLANE_TUNNEL_ID -ne 'tunnel_0123456789abcdef0123456789abcdef') { throw 'Persisted tunnel id was not loaded.' }
          if ($env:CONTROL_PLANE_ORGANIZATION_ID -ne 'org-ci') { throw 'Persisted organization id was not loaded.' }
          $scopeSet = @($env:RWMCP_HTTP_SCOPES -split ',')
          if (-not ($scopeSet -contains 'workstation.admin_request')) { throw 'Legacy execute scopes were not migrated to request-only Administrator scope.' }

          $secretPath = Get-RwmcpSecretPath
          $testSecret = 'sk-test-rwmcp-dpapi-0123456789abcdef'
          $testSecret | & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-secret.ps1 -Action Set -Path $secretPath
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI secret write failed.' }
          $roundTrip = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-secret.ps1 -Action Get -Path $secretPath
          if ($LASTEXITCODE -ne 0) { throw 'DPAPI secret read failed.' }
          if ($roundTrip.Trim() -ne $testSecret) { throw 'DPAPI secret round-trip mismatch.' }
          Remove-Item -Path $configDir -Recurse -Force
      - name: Smoke-test Windows runtime supervisor
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'rwmcp-supervisor-smoke'
          $workspace = Join-Path $tmp 'workspace'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $workspaceYaml = $workspace.Replace('\', '/')
          @"
          version: 1
          mode: workspace
          workspaces:
            - id: smoke
              root: $workspaceYaml
              readOnly: false
          filesystem:
            maxReadBytes: 1048576
            maxWriteBytes: 1048576
          search:
            maxResults: 20
            maxFiles: 100
            maxFileBytes: 1048576
          process:
            allowExecutables: [node]
            inheritEnv: [PATH, USERPROFILE, TEMP, TMP]
            maxOutputBytes: 65536
            maxRuntimeMs: 30000
          tasks: {}
          "@ | Set-Content -Path (Join-Path $tmp 'policy.yaml') -Encoding utf8
          "version: 1`nhosts: []`n" | Set-Content -Path (Join-Path $tmp 'hosts.yaml') -Encoding utf8
          $env:RWMCP_POLICY = Join-Path $tmp 'policy.yaml'
          $env:RWMCP_HOSTS = Join-Path $tmp 'hosts.yaml'
          $env:RWMCP_AUDIT = Join-Path $tmp 'audit.jsonl'
          $env:RWMCP_PORT = '18766'
          try {
            $startRaw = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\runtime-control-windows.ps1 -Action Start -Mode Local -Root $PWD -Json
            if ($LASTEXITCODE -ne 0) { throw 'Runtime supervisor start failed.' }
            $start = ($startRaw | Select-Object -Last 1) | ConvertFrom-Json
            if (-not $start.running -or -not $start.mcpHealthy) { throw "Runtime supervisor did not become healthy: $startRaw" }
            $expectedVersion = (Get-Content -Path .\package.json -Raw | ConvertFrom-Json).version
          if ($start.mcpVersion -ne $expectedVersion) { throw "Unexpected supervised runtime version: $($start.mcpVersion); expected $expectedVersion" }
            $statusRaw = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\runtime-control-windows.ps1 -Action Status -Root $PWD -Json
            $status = ($statusRaw | Select-Object -Last 1) | ConvertFrom-Json
            if (-not $status.running -or -not $status.mcpHealthy) { throw 'Runtime supervisor status check failed.' }

            $registerRaw = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\runtime-control-windows.ps1 -Action RegisterStartup -Mode Local -Root $PWD -Json
            if ($LASTEXITCODE -ne 0) { throw "User-level startup registration failed: $registerRaw" }
            $registered = ($registerRaw | Select-Object -Last 1) | ConvertFrom-Json
            if (-not $registered.startupRegistered) { throw 'Startup registration was not reported as enabled.' }
            if ($registered.startupMethod -ne 'registry-run') { throw "Unexpected startup method: $($registered.startupMethod)" }
            $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            $runValue = (Get-ItemProperty -Path $runKey -Name 'RemoteWorkstationMCP' -ErrorAction Stop).RemoteWorkstationMCP
            if ([string]::IsNullOrWhiteSpace([string]$runValue)) { throw 'HKCU Run startup value is empty.' }

            $unregisterRaw = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\runtime-control-windows.ps1 -Action UnregisterStartup -Root $PWD -Json
            if ($LASTEXITCODE -ne 0) { throw "User-level startup unregister failed: $unregisterRaw" }
            $unregistered = ($unregisterRaw | Select-Object -Last 1) | ConvertFrom-Json
            if ($unregistered.startupRegistered) { throw 'Startup registration remained enabled after unregister.' }
          } finally {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\runtime-control-windows.ps1 -Action UnregisterStartup -Root $PWD -Json | Out-Null
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\runtime-control-windows.ps1 -Action Stop -Root $PWD -Json | Out-Null
          }
      - name: Smoke-test loopback HTTP runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'rwmcp-win-smoke'
          $workspace = Join-Path $tmp 'workspace'
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $workspaceYaml = $workspace.Replace('\', '/')
          $policy = @"
          version: 1
          mode: workspace
          workspaces:
            - id: smoke
              root: $workspaceYaml
              readOnly: false
          filesystem:
            maxReadBytes: 1048576
            maxWriteBytes: 1048576
          search:
            maxResults: 20
            maxFiles: 100
            maxFileBytes: 1048576
          process:
            allowExecutables: [node]
            inheritEnv: [PATH, USERPROFILE, TEMP, TMP]
            maxOutputBytes: 65536
            maxRuntimeMs: 30000
          tasks: {}
          "@
          $hosts = @"
          version: 1
          hosts: []
          "@
          $policyPath = Join-Path $tmp 'policy.yaml'
          $hostsPath = Join-Path $tmp 'hosts.yaml'
          Set-Content -Path $policyPath -Value $policy -Encoding utf8
          Set-Content -Path $hostsPath -Value $hosts -Encoding utf8
          $env:RWMCP_POLICY = $policyPath
          $env:RWMCP_HOSTS = $hostsPath
          $env:RWMCP_AUDIT = Join-Path $tmp 'audit.jsonl'
          $env:RWMCP_CLIENT_ID = 'windows-ci'
          $env:RWMCP_CLIENT_TYPE = 'ci'
          $env:RWMCP_PORT = '8683'
          $process = Start-Process -FilePath node -ArgumentList 'dist/cli.js','--http' -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            foreach ($attempt in 1..30) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8683/healthz' -TimeoutSec 2
                if ($health.ok -eq $true) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw 'Windows loopback MCP health check did not become ready.' }
            if ($health.mode -ne 'workspace') { throw "Unexpected mode: $($health.mode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
