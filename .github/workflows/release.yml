name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run plugin:validate
      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"; exit 1; }
      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p release
          PACK="$(npm pack --pack-destination release --silent)"
          mv "release/$PACK" "release/remote-workstation-mcp-${GITHUB_REF_NAME}.tgz"
          cp scripts/install-windows-release.ps1 release/install-windows.ps1
          cp scripts/install-windows-bootstrap.cmd release/install-windows.cmd
          cp scripts/install-linux.sh release/install-linux.sh
          npm sbom --sbom-format cyclonedx > release/rwmcp-sbom.cdx.json
          (
            cd release
            sha256sum \
              "remote-workstation-mcp-${GITHUB_REF_NAME}.tgz" \
              install-windows.ps1 install-windows.cmd install-linux.sh \
              rwmcp-sbom.cdx.json > SHA256SUMS.txt
          )
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "release/remote-workstation-mcp-${GITHUB_REF_NAME}.tgz" \
            "release/install-windows.ps1" \
            "release/install-windows.cmd" \
            "release/install-linux.sh" \
            "release/rwmcp-sbom.cdx.json" \
            "release/SHA256SUMS.txt" \
            --clobber
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for REQUIRED in \
            "remote-workstation-mcp-${GITHUB_REF_NAME}.tgz" \
            install-windows.ps1 install-windows.cmd install-linux.sh \
            rwmcp-sbom.cdx.json SHA256SUMS.txt; do
            printf '%s\n' "$ASSETS" | grep -Fx -- "$REQUIRED" >/dev/null || {
              echo "Missing required release asset: $REQUIRED"
              exit 1
            }
          done
