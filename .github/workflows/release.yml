name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      tag:
        description: Exact release tag to publish.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Validate dependency install-script policy
        run: npm run supply-chain:validate
      - name: Scan tracked files for high-confidence secrets
        run: npm run security:scan
      - run: npm run typecheck
      - name: Enforce architecture boundaries
        run: npm run architecture:check
      - run: npm test
      - run: npm run build
      - run: npm run plugin:validate
      - name: Verify tag matches package version and checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG"; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION" || { echo "Tag $RELEASE_TAG does not match package version v$VERSION"; exit 1; }
          git fetch --tags --force
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)" || {
            echo "Checked-out commit does not match $RELEASE_TAG"
            exit 1
          }
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          PACK="$(npm pack --pack-destination release --silent)"
          mv "release/$PACK" "release/remote-workstation-mcp-${RELEASE_TAG}.tgz"
          cp scripts/install-windows-release.ps1 release/install-windows.ps1
          cp scripts/install-windows-bootstrap.cmd release/install-windows.cmd
          npm sbom --sbom-format cyclonedx > release/rwmcp-sbom.cdx.json
          (
            cd release
            sha256sum \
              "remote-workstation-mcp-${RELEASE_TAG}.tgz" \
              install-windows.ps1 install-windows.cmd \
              rwmcp-sbom.cdx.json > SHA256SUMS.txt
          )
      - name: Smoke-test packed Windows release
        shell: pwsh
        run: |
          $archive = Join-Path 'release' ("remote-workstation-mcp-" + $env:RELEASE_TAG + ".tgz")
          .\scripts\smoke-package-windows.ps1 -Archive $archive
      - name: Create a new draft GitHub Release (existing releases are immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to modify existing release $RELEASE_TAG; historical assets are immutable." >&2
            exit 1
          fi
          PRERELEASE_ARGS=()
          if [[ "$RELEASE_TAG" =~ -dev\.[0-9]+$ ]]; then PRERELEASE_ARGS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}"
      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "release/remote-workstation-mcp-${RELEASE_TAG}.tgz" \
            "release/install-windows.ps1" \
            "release/install-windows.cmd" \
            "release/rwmcp-sbom.cdx.json" \
            "release/SHA256SUMS.txt"
      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for REQUIRED in \
            "remote-workstation-mcp-${RELEASE_TAG}.tgz" \
            install-windows.ps1 install-windows.cmd \
            rwmcp-sbom.cdx.json SHA256SUMS.txt; do
            printf '%s\n' "$ASSETS" | grep -Fx -- "$REQUIRED" >/dev/null || {
              echo "Missing required release asset: $REQUIRED"
              exit 1
            }
          done

      - name: Publish only after Windows release assets are verified
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
