name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "Tag $GITHUB_REF_NAME does not match package version v$VERSION"; exit 1; }
      - name: Build release assets
        run: |
          mkdir -p release
          PACK="$(npm pack --pack-destination release --silent)"
          mv "release/$PACK" "release/remote-workstation-mcp-${GITHUB_REF_NAME}.tgz"
          (cd release && sha256sum "remote-workstation-mcp-${GITHUB_REF_NAME}.tgz" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/remote-workstation-mcp-${GITHUB_REF_NAME}.tgz" \
            "release/SHA256SUMS.txt" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
