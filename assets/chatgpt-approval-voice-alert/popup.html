<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { width: 320px; padding: 16px; font: 14px/1.5 "Segoe UI", sans-serif; color:#1b2430; background:#f7fafd; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 8px 0; }
    label { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; gap: 8px; }
    input[type="range"] { width: 180px; }
    button { border: 0; padding: 9px 12px; border-radius: 7px; color: white; background:#1457a0; cursor:pointer; }
    button:disabled { opacity: .5; }
    .note { color: #45566b; font-size:12px; }
    #status { font-weight: 600; min-height: 2.8em; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>🔔 RWMCP — Cảnh báo cấp quyền</h1>
  <p class="note">Chỉ thông báo bằng giọng nói, không tự chọn Allow.</p>
  <label>Đang bật <input type="checkbox" id="enabled" checked></label>
  <label>Âm lượng <input id="volume" type="range" min="0" max="100" value="90" step="5"></label>
  <button id="test" type="button">🔊 Thử giọng đọc</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="note">Nhắc tối đa 3 lần, cách nhau 30 giây. Chỉ trên trang ChatGPT. Tiện ích không đọc nội dung hội thoại.</p>
  <script src="popup.js"></script>
</body>
</html>
