version: 1
mode: workspace

workspaces:
  - id: projects
    name: Projects
    root: /home/your-user/Projects
    readOnly: false

filesystem:
  maxReadBytes: 1048576
  maxWriteBytes: 1048576

search:
  maxResults: 100
  maxFiles: 5000
  maxFileBytes: 1048576

process:
  allowExecutables:
    - git
    - node
    - npm
    - npx
    - python3
    - cmake
    - ninja
    - make
    # Add each language-server executable you explicitly approve, for example:
    # - clangd
  inheritEnv:
    - PATH
    - HOME
    - LANG
    - LC_ALL
    - TERM
    - TMPDIR
    - TMP
    - TEMP
  maxOutputBytes: 262144
  maxRuntimeMs: 600000
  # Upper bound for one stdin write and queued stdin backpressure.
  maxInputBytes: 65536

tasks:
  node-test:
    program: npm
    args: [test]
    cwd: .
  node-build:
    program: npm
    args: [run, build]
    cwd: .
  cmake-build:
    program: cmake
    args: [--build, build]
    cwd: .

# Optional semantic-code layer. A profile is inert until its executable is also
# present in process.allowExecutables. File extension keys may include or omit '.'.
lsp:
  requestTimeoutMs: 10000
  maxMessageBytes: 2097152
  diagnosticsSettleMs: 250
  servers:
    # clangd:
    #   program: clangd
    #   args: [--background-index]
    #   languages:
    #     .c: c
    #     .h: c
    #     .cc: cpp
    #     .cpp: cpp
    #     .cxx: cpp
    #     .hpp: cpp

# These gates stay disabled even when a full-control lease exists unless
# the owner explicitly opts in locally. Never enable them in a public/shared config.
fullControl:
  allowRawShell: false
  allowHostFilesystem: false

privileged:
  allowSudo: false
  maxRuntimeMs: 600000

# Typed engineering adapters. The adapters themselves constrain backend/argv;
# destructive hardware changes remain separately permission-gated.
engineering:
  enabled: true
  maxCommandRuntimeMs: 600000
  allowHardwareMutationInWorkspace: false
  allowSerialWriteInWorkspace: false

# Cross-node data exchange is DEFAULT DENY.
# Enabling it is not enough: the same directional grant must also be present
# on the other participating Direct Node. Only the authenticated OpenAI Secure
# MCP Tunnel principal with the dedicated cross-node scope can use these grants.
multiNode:
  enabled: false
  controllerPrincipalId: openai-tunnel
  controllerPrincipalType: openai-secure-mcp-tunnel
  grants: []
  # Example only — copy and narrow this on BOTH participating nodes:
  # grants:
  #   - id: windows-build-to-vision
  #     enabled: true
  #     sourceNodeId: dev_source_example
  #     destinationNodeId: dev_destination_example
  #     sourceWorkspace: stm32
  #     destinationWorkspace: projects
  #     sourcePathPrefixes:
  #       - B300-Main-Custom/exports
  #     destinationBasePaths:
  #       - incoming/b300
  #     allowedExtensions:
  #       - .hex
  #       - .bin
  #       - .json
  #       - .log
  #     maxBytes: 33554432
  #     transports:
  #       - direct
  #       - relay

# Legacy workstation-to-workstation SSH/device execution is disabled by default.
# Keep this false for the Direct-Node architecture. Enable only for an explicit
# owner-selected bootstrap/recovery workflow.
legacyRemoteControl:
  enabled: false
