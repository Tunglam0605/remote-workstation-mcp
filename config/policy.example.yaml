version: 1
mode: workspace

workspaces:
  - id: projects
    name: Projects
    root: /home/your-user/Projects
    readOnly: false

filesystem:
  maxReadBytes: 1048576
  maxWriteBytes: 1048576

search:
  maxResults: 100
  maxFiles: 5000
  maxFileBytes: 1048576

process:
  allowExecutables:
    - git
    - node
    - npm
    - npx
    - python3
    - cmake
    - ninja
    - make
  inheritEnv:
    - PATH
    - HOME
    - LANG
    - LC_ALL
    - TERM
    - TMPDIR
    - TMP
    - TEMP
  maxOutputBytes: 262144
  maxRuntimeMs: 600000

tasks:
  node-test:
    program: npm
    args: [test]
    cwd: .
  node-build:
    program: npm
    args: [run, build]
    cwd: .
  cmake-build:
    program: cmake
    args: [--build, build]
    cwd: .

# These gates stay disabled even when a full-control lease exists unless
# the owner explicitly opts in locally. Never enable them in a public/shared config.
fullControl:
  allowRawShell: false
  allowHostFilesystem: false

privileged:
  allowSudo: false
  maxRuntimeMs: 600000
